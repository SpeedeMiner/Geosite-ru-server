name: GeoSite Server release channel

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      snapshot_sha: ${{ steps.project.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test projection and release selection
        run: python3 -m unittest discover -s tools -v
      - name: Build against the verified channel baseline
        id: project
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: bash tools/sync_release_channel.sh build "$CHANNEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geosite-ru-server-${{ inputs.channel }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: geosite-ru-server-${{ inputs.channel }}-${{ github.run_attempt }}
          path: dist
      - name: Publish the verified channel
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          SNAPSHOT_SHA: ${{ needs.build.outputs.snapshot_sha }}
        run: bash tools/sync_release_channel.sh publish "$CHANNEL"
