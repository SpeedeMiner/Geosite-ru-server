name: Build Ultimate Light RU Geosite SERVER (RU Only)

on:
  workflow_dispatch:
  schedule:
    # Каждый понедельник в 00:00 UTC (0 = воскресенье / 1 = понедельник)
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat
      YULARZHI_GEOSITE_URL: https://github.com/Yularzhi/geosite_russia/releases/latest/download/geosite.dat
      VPNYASHA_GEOSITE_URL: https://raw.githubusercontent.com/vpnyasha/geosite/main/geosite.dat
      KIRILL_GEOSITE_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/dlc.dat
      DIGNE_GEOSITE_URL: https://cdn.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geosite.dat
      DAVOYAN_LEGACY_URL: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/category-ru-legacy.txt

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      YULARZHI_INPUT_FILE: yularzhi-geosite.dat
      VPNYASHA_INPUT_FILE: vpnyasha-geosite.dat
      KIRILL_INPUT_FILE: kirill-geosite.dat
      DIGNE_INPUT_FILE: digne-geosite.dat
      DAVOYAN_LEGACY_INPUT_FILE: davoyan-category-ru-legacy.txt
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          persist-credentials: false
          path: domain-list-community
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      # ------------------------------------------------------------
      # 4. Download source geosite.dat
      # ------------------------------------------------------------
      - name: Download source GeoSite files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading GeoSite sources"
          echo "========================================"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_URL" \
            -o "$INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_SHA_URL" \
            -o source-geosite.dat.sha256sum

          curl -fL --retry 5 --retry-all-errors \
            "$HYDRA_GEOSITE_URL" \
            -o "$HYDRA_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$GRIMBIRD_GEOSITE_URL" \
            -o "$GRIMBIRD_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$MVR_GEOSITE_URL" \
            -o "$MVR_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$YULARZHI_GEOSITE_URL" \
            -o "$YULARZHI_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$VPNYASHA_GEOSITE_URL" \
            -o "$VPNYASHA_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$KIRILL_GEOSITE_URL" \
            -o "$KIRILL_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$DIGNE_GEOSITE_URL" \
            -o "$DIGNE_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$DAVOYAN_LEGACY_URL" \
            -o "$DAVOYAN_LEGACY_INPUT_FILE"

          test -s "$INPUT_FILE"
          test -s source-geosite.dat.sha256sum
          test -s "$HYDRA_INPUT_FILE"
          test -s "$GRIMBIRD_INPUT_FILE"
          test -s "$MVR_INPUT_FILE"
          test -s "$YULARZHI_INPUT_FILE"
          test -s "$VPNYASHA_INPUT_FILE"
          test -s "$KIRILL_INPUT_FILE"
          test -s "$DIGNE_INPUT_FILE"
          test -s "$DAVOYAN_LEGACY_INPUT_FILE"
          test -s "$GRIMBIRD_INPUT_FILE"
          test -s "$MVR_INPUT_FILE"
          test -s "$YULARZHI_INPUT_FILE"
          test -s "$VPNYASHA_INPUT_FILE"
          test -s "$KIRILL_INPUT_FILE"
          test -s "$DIGNE_INPUT_FILE"
          test -s "$DAVOYAN_LEGACY_INPUT_FILE"

          echo
          echo "========================================"
          echo "Verifying SHA256 of runetfreedom source"
          echo "========================================"

          EXPECTED_SHA256="$(awk 'NF {print $1; exit}' source-geosite.dat.sha256sum)"
          ACTUAL_SHA256="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: SHA256 mismatch for runetfreedom source!"
            exit 1
          fi

          echo "SHA256 verification OK."

          echo
          echo "Downloaded sources:"
          ls -lh "$INPUT_FILE" "$HYDRA_INPUT_FILE" "$GRIMBIRD_INPUT_FILE" "$MVR_INPUT_FILE" "$YULARZHI_INPUT_FILE" "$VPNYASHA_INPUT_FILE" "$KIRILL_INPUT_FILE" "$DIGNE_INPUT_FILE" "$DAVOYAN_LEGACY_INPUT_FILE"

      # ------------------------------------------------------------
      # 5. Build complete RU category manifest
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          DATA = Path("domain-list-community/data")
          output = Path("selected_ru_categories.txt")

          selected = set()
          visited = set()
          missing_v2fly = set()

          # Negative / private categories are never merged into RU.
          excluded = {
              # Never merge private/non-RU feeds into the public RU-only pool.
              "private",
              "category-ip-geo-detect",
              "ipip",
              "tld-ru",
              "category-geoblock-ru",
          }

          def normalize(name: str) -> str:
              return name.strip().lower()

          def is_negative_category(name: str) -> bool:
              name = normalize(name)
              if not name:
                  return False
              if any(marker in name for marker in ("blocked", "geoblock", "re-filter", "refilter")):
                  return True
              return re.search(r"(^|[-_.])ban([-_.]|$)", name) is not None

          def is_excluded(name: str) -> bool:
              name = normalize(name)
              if not name:
                  return True
              if name in excluded:
                  return True
              return is_negative_category(name)

          def visit(name: str):
              name = normalize(name)

              if not name or name in visited or is_excluded(name):
                  return

              visited.add(name)
              path = DATA / name

              if not path.is_file():
                  missing_v2fly.add(name)
                  return

              selected.add(f"runetfreedom|{name}")

              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  return

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue

                  if line.lower().startswith("include:"):
                      target = line.split(":", 1)[1].strip().split()[0]
                      if re.fullmatch(r"[A-Za-z0-9_.!+-]+", target):
                          visit(target)

          # Основное ядро runetfreedom / v2fly
          visit("category-ru")

          # Автоматически подхватываем новые *-ru категории
          for path in DATA.iterdir():
              if path.is_file() and path.name.lower().endswith("-ru"):
                  visit(path.name)

          # Дополнительные категории runetfreedom / v2fly
          extra_categories = {
              "ru-available-only-inside",
              "category-geoblock-ru",
              "category-media-ru-blocked",

              "yandex", "vk", "mailru", "mailru-group", "kinopoisk",
              "dzen", "ozon", "wildberries", "wb", "avito", "autoru",
              "aviasales", "rutube", "wink", "2gis", "ok", "okko",
              "sokolov", "x5", "mosmetro", "max",

              "beget", "carrotquest", "cdek", "comssone", "drweb",
              "envybox", "gismeteo", "group-ib", "headhunter", "ideco-ru",
              "kaspersky", "kontur", "mindbox", "myoffice-ru", "netcraze",
              "nic-ru", "positive-technologies", "regru", "selectel",
              "servicepipe", "skyeng", "smena", "tilda", "timeweb",
              "ucoz", "whoosh",

              "megafon", "mts", "mts-ru", "rostelecom", "t2", "t2-ru",
              "beeline",

              "1c", "1cloud", "1tv", "aeroflot", "alfabank", "avru",
              "bronevik", "cdnvideo", "citydrive", "dellin", "dixy",
              "dnevnikru", "dns-shop", "dodopizza", "domclick", "edadeal",
              "fastvps", "fixprice", "jivo", "kuper", "lemanapro",
              "lenta", "lentaru", "magnit", "megamarket", "motivtelecom",
              "ngenix", "ntv", "pochtaru", "psbank", "rambler", "rbc",
              "rt", "ruvds", "rzd", "samokat", "smotrim", "tass",
              "taxsee", "tbank", "tnt", "tutu", "vgtrk", "vtb",
              "vkusnoitochka", "vkusvill", "zentotem",

              "3ebra", "apptrackpets", "flomni", "foto-planeta", "gazfond-pn",
              "litres", "meteoinfo", "nplus1", "ognihome", "ponyexpress",
              "qms", "randomgodbot", "srv-hub", "t1", "vimu", "yourgood",

              "corp.express", "express.ms", "public.express", "xlnk.ms",
              "mfa.center", "multifactor",

              "moex", "spvb", "banki", "finuslugi", "nspk", "mironline",
              "mirpayonline", "sistema-capital", "efin", "credistory",
              "nbki", "netmonet", "tips",
          }

          optional_missing = []
          for name in sorted(extra_categories):
              if is_excluded(name):
                  continue
              path = DATA / normalize(name)
              if path.is_file():
                  visit(name)
              else:
                  optional_missing.append(normalize(name))

          if missing_v2fly:
              print("ERROR: required v2fly include categories are missing:")
              for name in sorted(missing_v2fly):
                  print(f"  - {name}")
              raise SystemExit(1)

          print(f"Optional categories absent in current v2fly data: {len(optional_missing)}")

          selected = {
              item for item in selected
              if not is_excluded(item.split("|", 1)[1])
          }

          # hydraponique/roscomvpn-geosite
          hydra_categories = {
              "whitelist",
              "category-ru",
          }
          for name in hydra_categories:
              if not is_excluded(name):
                  selected.add(f"hydra|{normalize(name)}")

          # mvrvntn/routing — только CATEGORY-RU добавляется в общий RU
          mvr_categories = {
              "category-ru",
          }
          for name in mvr_categories:
              if not is_excluded(name):
                  selected.add(f"mvrvntn|{normalize(name)}")

          # Yularzhi/geosite_russia — только CATEGORY-RU
          yularzhi_categories = {
              "category-ru",
          }
          for name in yularzhi_categories:
              if not is_excluded(name):
                  selected.add(f"yularzhi|{normalize(name)}")

          # vpnyasha/geosite
          vpnyasha_categories = {
              "our-whitelist",
              "our-category-ru",
              "our-games",
          }
          for name in vpnyasha_categories:
              if not is_excluded(name):
                  selected.add(f"vpnyasha|{normalize(name)}")

          # kirilllavrov/RU-domain-list-for-whitelist
          kirill_categories = {
              "category-ru",
          }
          for name in kirill_categories:
              if not is_excluded(name):
                  selected.add(f"kirill|{normalize(name)}")

          # DigneZzZ/routing
          digne_categories = {
              "category-ru",
          }
          for name in digne_categories:
              if not is_excluded(name):
                  selected.add(f"digne|{normalize(name)}")

          # GrimbirdUsers/ru-routing-dat
          grimbird_categories = {
              "category-ru-whitelist",
              "ozon",
              "ru-analytics",
              "ru-cdn",
              "ru-finance",
              "ru-medical",
              "ru-retail-extra",
              "ru-transport",
              "ru-tv",
              "ru-whitelist-extended",
              "swift",
          }
          for name in grimbird_categories:
              if not is_excluded(name):
                  selected.add(f"grimbird|{normalize(name)}")

          selected = {
              item for item in selected
              if item and item.split("|", 1)[1]
              and not item.split("|", 1)[1].startswith(".")
              and not is_excluded(item.split("|", 1)[1])
          }

          leaked_negative = sorted(
              item for item in selected
              if is_negative_category(item.split("|", 1)[1])
              or normalize(item.split("|", 1)[1]) == "private"
          )
          if leaked_negative:
              print("ERROR: negative/private categories leaked into manifest:")
              for item in leaked_negative:
                  print(f"  - {item}")
              raise SystemExit(1)

          with output.open("w", encoding="utf-8") as f:
              for item in sorted(selected):
                  f.write(item + "\n")

          print(f"\nManifest written to: {output}")
          PY

          cp selected_ru_categories.txt "$CATEGORY_FILE"

          echo
          echo "=== Total manifest entries ==="
          wc -l "$CATEGORY_FILE"

          echo
          echo "=== External categories merged into RU ==="
          grep -E '^(hydra|grimbird|mvrvntn|yularzhi|vpnyasha|kirill|digne)\|' "$CATEGORY_FILE"

      # ------------------------------------------------------------
      # 6. Create protobuf filter
      # ------------------------------------------------------------
      - name: Create RU GeoSite protobuf filter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p domain-list-community/tools/ru-geosite-filter

          cat > domain-list-community/tools/ru-geosite-filter/main.go <<'EOF'
          package main
          
          import (
          	"bufio"
          	"fmt"
          	"os"
          	"sort"
          	"strings"
          
          	router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )
          
          func normalizeName(value string) string {
          	return strings.ToLower(strings.TrimSpace(value))
          }
          
          func isRussianTLD(value string) bool {
          	value = normalizeName(value)
          	value = strings.TrimSuffix(value, ".")
          	value = strings.TrimPrefix(value, ".")
          
          	switch value {
          	case "ru", "su", "xn--p1ai", "рф":
          		return true
          	}
          
          	return strings.HasSuffix(value, ".ru") ||
          		strings.HasSuffix(value, ".su") ||
          		strings.HasSuffix(value, ".xn--p1ai") ||
          		strings.HasSuffix(value, ".рф")
          }
          
          func domainKey(domain *router.Domain) string {
          	return fmt.Sprintf("%d|%s", domain.Type, normalizeName(domain.Value))
          }
          
          func pruneCoveredRootDomains(domains []*router.Domain) ([]*router.Domain, int) {
          	roots := make(map[string]bool)
          	for _, domain := range domains {
          		if domain == nil || domain.Type != router.Domain_RootDomain {
          			continue
          		}
          		value := normalizeName(domain.Value)
          		if value != "" {
          			roots[value] = true
          		}
          	}
          
          	result := make([]*router.Domain, 0, len(domains))
          	removed := 0
          	for _, domain := range domains {
          		if domain == nil || domain.Type != router.Domain_RootDomain {
          			result = append(result, domain)
          			continue
          		}
          
          		value := normalizeName(domain.Value)
          		covered := false
          		for parent := value; ; {
          			dot := strings.IndexByte(parent, '.')
          			if dot < 0 {
          				break
          			}
          			parent = parent[dot+1:]
          			if roots[parent] {
          				covered = true
          				break
          			}
          		}
          
          		if covered {
          			removed++
          			continue
          		}
          		result = append(result, domain)
          	}
          	return result, removed
          }
          
          func loadGeoSite(path string) (*router.GeoSiteList, error) {
          	data, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          
          	list := new(router.GeoSiteList)
          	if err := proto.Unmarshal(data, list); err != nil {
          		return nil, fmt.Errorf("invalid geosite %s: %w", path, err)
          	}
          
          	return list, nil
          }
          
          func loadManifest(path string) (map[string]map[string]bool, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return nil, err
          	}
          	defer file.Close()
          
          	result := make(map[string]map[string]bool)
          	scanner := bufio.NewScanner(file)
          
          	for scanner.Scan() {
          		line := strings.TrimSpace(scanner.Text())
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          
          		parts := strings.SplitN(line, "|", 2)
          		if len(parts) != 2 {
          			return nil, fmt.Errorf("invalid manifest entry: %q", line)
          		}
          
          		source := normalizeName(parts[0])
          		category := normalizeName(parts[1])
          		if source == "" || category == "" {
          			return nil, fmt.Errorf("invalid manifest entry: %q", line)
          		}
          
          		if result[source] == nil {
          			result[source] = make(map[string]bool)
          		}
          		result[source][category] = true
          	}
          
          	if err := scanner.Err(); err != nil {
          		return nil, err
          	}
          
          	return result, nil
          }
          
          func loadLegacyDomains(path string) ([]string, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return nil, err
          	}
          	defer file.Close()
          
          	var domains []string
          	seen := make(map[string]bool)
          	scanner := bufio.NewScanner(file)
          
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          		if line == "" {
          			continue
          		}
          
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"DOMAIN-SUFFIX,", "DOMAIN-FULL,", "DOMAIN,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		for _, prefix := range []string{"DOMAIN-KEYWORD,", "DOMAIN-REGEX,", "DOMAIN-WILDCARD,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = ""
          				break
          			}
          		}
          		if line == "" {
          			continue
          		}
          
          		for _, prefix := range []string{"domain:", "full:"} {
          			if strings.HasPrefix(strings.ToLower(line), prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          
          		line = strings.TrimSpace(strings.TrimPrefix(line, "-"))
          		line = strings.TrimPrefix(line, "*.")
          		line = normalizeName(line)
          		line = strings.TrimSuffix(line, ".")
          
          		if line == "" || strings.ContainsAny(line, " \t:/\\[](){}|$") {
          			continue
          		}
          
          		allNumeric := true
          		for _, ch := range line {
          			if (ch < '0' || ch > '9') && ch != '.' {
          				allNumeric = false
          				break
          			}
          		}
          		if allNumeric {
          			continue
          		}
          
          		if seen[line] {
          			continue
          		}
          		seen[line] = true
          		domains = append(domains, line)
          	}
          
          	if err := scanner.Err(); err != nil {
          		return nil, err
          	}
          	if len(domains) == 0 {
          		return nil, fmt.Errorf("Davoyan legacy domain list is empty")
          	}
          	return domains, nil
          }
          
          func main() {
          	if len(os.Args) != 12 {
          		fmt.Fprintf(
          			os.Stderr,
          			"usage: %s runetfreedom.dat hydra.dat grimbird.dat mvrvntn.dat yularzhi.dat vpnyasha.dat kirill.dat digne.dat davoyan-legacy.txt selected.txt output.dat\n",
          			os.Args[0],
          		)
          		os.Exit(2)
          	}
          
          	sources := map[string]string{
          		"runetfreedom": os.Args[1],
          		"hydra":        os.Args[2],
          		"grimbird":     os.Args[3],
          		"mvrvntn":      os.Args[4],
          		"yularzhi":     os.Args[5],
          		"vpnyasha":     os.Args[6],
          		"kirill":       os.Args[7],
          		"digne":        os.Args[8],
          	}
          
          	legacyDomains, err := loadLegacyDomains(os.Args[9])
          	if err != nil {
          		panic(fmt.Errorf("failed to read Davoyan legacy list: %w", err))
          	}
          
          	manifest, err := loadManifest(os.Args[10])
          	if err != nil {
          		panic(fmt.Errorf("failed to read manifest: %w", err))
          	}
          
          	lists := make(map[string]*router.GeoSiteList)
          	for source, path := range sources {
          		list, err := loadGeoSite(path)
          		if err != nil {
          			panic(err)
          		}
          		lists[source] = list
          	}
          
          	result := new(router.GeoSiteList)
          	ruCategory := &router.GeoSite{CountryCode: "RU"}
          	globalSeen := make(map[string]bool)
          
          	sourceCategoryCount := 0
          	sourceDomainCount := 0
          	writtenDomainCount := 0
          	duplicateDomainCount := 0
          	removedRussianDomainCount := 0
          	removedUnsupportedTypeCount := 0
          	convertedFullToRootCount := 0
          	removedCoveredDomainCount := 0
          	missingExternalCount := 0
          
          	matched := make(map[string]map[string]bool)
          	for source := range sources {
          		matched[source] = make(map[string]bool)
          	}
          
          	for source, selectedCategories := range manifest {
          		list, ok := lists[source]
          		if !ok {
          			panic(fmt.Sprintf("unknown source in manifest: %s", source))
          		}
          
          		for _, site := range list.Entry {
          			if site == nil {
          				continue
          			}
          
          			category := normalizeName(site.CountryCode)
          			if !selectedCategories[category] {
          				continue
          			}
          
          			matched[source][category] = true
          			sourceCategoryCount++
          
          			for _, domain := range site.Domain {
          				if domain == nil {
          					continue
          				}
          
          				sourceDomainCount++
          
          				switch domain.Type {
          				case router.Domain_RootDomain:
          				case router.Domain_Full:
          					convertedFullToRootCount++
          				default:
          					removedUnsupportedTypeCount++
          					continue
          				}
          
          				value := normalizeName(domain.Value)
          				if value == "" {
          					continue
          				}
          
          				if isRussianTLD(value) {
          					removedRussianDomainCount++
          					continue
          				}
          
          				cleaned := &router.Domain{
          					Type:  router.Domain_RootDomain,
          					Value: value,
          				}
          
          				key := domainKey(cleaned)
          				if globalSeen[key] {
          					duplicateDomainCount++
          					continue
          				}
          
          				globalSeen[key] = true
          				ruCategory.Domain = append(ruCategory.Domain, cleaned)
          				writtenDomainCount++
          			}
          		}
          	}
          
          	for _, source := range []string{"hydra", "grimbird", "mvrvntn", "yularzhi", "vpnyasha", "kirill", "digne"} {
          		for category := range manifest[source] {
          			if !matched[source][category] {
          				fmt.Printf(
          					"WARNING: requested external category %s|%s was not found in source DAT\n",
          					source,
          					category,
          				)
          				missingExternalCount++
          			}
          		}
          	}
          
          	if missingExternalCount > 0 {
          		panic(fmt.Sprintf(
          			"required external categories missing: %d",
          			missingExternalCount,
          		))
          	}
          
          	for _, value := range legacyDomains {
          		if isRussianTLD(value) {
          			removedRussianDomainCount++
          			continue
          		}
          
          		cleaned := &router.Domain{
          			Type:  router.Domain_RootDomain,
          			Value: normalizeName(value),
          		}
          		key := domainKey(cleaned)
          		if globalSeen[key] {
          			duplicateDomainCount++
          			continue
          		}
          		globalSeen[key] = true
          		ruCategory.Domain = append(ruCategory.Domain, cleaned)
          		writtenDomainCount++
          	}
          
          	for _, value := range []string{"ru", "xn--p1ai", "su"} {
          		key := fmt.Sprintf("%d|%s", router.Domain_RootDomain, value)
          		if !globalSeen[key] {
          			globalSeen[key] = true
          			ruCategory.Domain = append(ruCategory.Domain, &router.Domain{
          				Type:  router.Domain_RootDomain,
          				Value: value,
          			})
          			writtenDomainCount++
          		}
          	}
          
          	var pruned int
          	ruCategory.Domain, pruned = pruneCoveredRootDomains(ruCategory.Domain)
          	removedCoveredDomainCount += pruned
          
          	sort.Slice(ruCategory.Domain, func(i, j int) bool {
          		a := ruCategory.Domain[i]
          		b := ruCategory.Domain[j]
          		if a.Type != b.Type {
          			return a.Type < b.Type
          		}
          		return normalizeName(a.Value) < normalizeName(b.Value)
          	})
          
          	if len(ruCategory.Domain) == 0 {
          		panic("RU category is empty")
          	}
          
          	result.Entry = append(result.Entry, ruCategory)
          
          	outputData, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
          	if err != nil {
          		panic(fmt.Errorf("failed to marshal final output DAT: %w", err))
          	}
          
          	if err := os.WriteFile(os.Args[11], outputData, 0644); err != nil {
          		panic(fmt.Errorf("failed to write output DAT: %w", err))
          	}
          
          	fmt.Println()
          	fmt.Println("========================================")
          	fmt.Println("RU LIGHT GEOSITE BUILD")
          	fmt.Println("========================================")
          	fmt.Printf("Source category matches : %d\n", sourceCategoryCount)
          	fmt.Printf("Source domain rules     : %d\n", sourceDomainCount)
          	fmt.Printf("Written domain rules    : %d\n", writtenDomainCount)
          	fmt.Printf("Removed RU TLD rules    : %d\n", removedRussianDomainCount)
          	fmt.Printf("Removed regex/keyword   : %d\n", removedUnsupportedTypeCount)
          	fmt.Printf("Removed duplicates      : %d\n", duplicateDomainCount)
          	fmt.Printf("Full -> RootDomain (RU): %d\n", convertedFullToRootCount)
          	fmt.Printf("Covered RU domains removed: %d\n", removedCoveredDomainCount)
          	fmt.Printf("Final categories        : %d\n", len(result.Entry))
          	fmt.Printf("Final DAT size          : %d bytes\n", len(outputData))
          	fmt.Println("Output categories       : RU only (all attributes stripped)")
          }
          EOF

          cd domain-list-community
          echo "=== gofmt ==="
          gofmt -w tools/ru-geosite-filter/main.go

          echo "=== go test ==="
          go test ./tools/ru-geosite-filter

          echo "=== go build ==="
          go build -o /tmp/ru-geosite-filter ./tools/ru-geosite-filter
          echo "Filter compiled and tested successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat (RU only)
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          /tmp/ru-geosite-filter \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            "$YULARZHI_INPUT_FILE" \
            "$VPNYASHA_INPUT_FILE" \
            "$KIRILL_INPUT_FILE" \
            "$DIGNE_INPUT_FILE" \
            "$DAVOYAN_LEGACY_INPUT_FILE" \
            selected_ru_categories.txt \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"
          ls -lh "$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 8. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" | tee "$OUTPUT_SHA_FILE"

      # ------------------------------------------------------------
      # 9. Final validation
      # ------------------------------------------------------------
      - name: Validate final DAT
        shell: bash
        run: |
          set -euo pipefail

          cd domain-list-community

          cat > tools/ru-geosite-filter/validate.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func isRussianTLD(value string) bool {
              value = strings.ToLower(strings.TrimSpace(value))
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf(
                  "%d|%s",
                  domain.Type,
                  strings.ToLower(strings.TrimSpace(domain.Value)),
              )
          }

          func main() {
              if len(os.Args) != 2 {
                  os.Exit(2)
              }

              data, err := os.ReadFile(os.Args[1])
              if err != nil {
                  panic(err)
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  panic(fmt.Errorf("invalid geosite protobuf: %w", err))
              }

              if len(list.Entry) != 1 {
                  panic(fmt.Sprintf(
                      "expected exactly 1 category (RU), got %d",
                      len(list.Entry),
                  ))
              }

              ru := list.Entry[0]
              if ru == nil || strings.ToLower(strings.TrimSpace(ru.CountryCode)) != "ru" {
                  panic("the only output category must be RU")
              }

              seen := make(map[string]bool, len(ru.Domain))
              roots := make(map[string]bool, len(ru.Domain))
              expectedTLD := map[string]bool{
                  "ru":       false,
                  "xn--p1ai": false,
                  "su":       false,
              }

              for _, domain := range ru.Domain {
                  if domain == nil {
                      panic("RU contains nil domain")
                  }

                  if len(domain.Attribute) > 0 {
                      panic(fmt.Sprintf("leaked attributes found in domain: %s (count: %d)", domain.Value, len(domain.Attribute)))
                  }

                  if domain.Type != router.Domain_RootDomain {
                      panic(fmt.Sprintf(
                          "RU contains non-RootDomain rule: %v",
                          domain.Type,
                      ))
                  }

                  value := strings.ToLower(strings.TrimSpace(domain.Value))
                  if value == "" {
                      panic("RU contains empty domain value")
                  }

                  key := domainKey(domain)
                  if seen[key] {
                      panic(fmt.Sprintf("duplicate domain in RU: %s", domain.Value))
                  }
                  seen[key] = true
                  roots[value] = true

                  if _, ok := expectedTLD[value]; ok {
                      expectedTLD[value] = true
                  }

                  if isRussianTLD(value) &&
                      value != "ru" && value != "su" && value != "xn--p1ai" {
                      panic(fmt.Sprintf("Russian TLD leaked into RU: %s", domain.Value))
                  }
              }

              for value := range roots {
                  for parent := value; ; {
                      dot := strings.IndexByte(parent, '.')
                      if dot < 0 {
                          break
                      }
                      parent = parent[dot+1:]
                      if roots[parent] {
                          panic(fmt.Sprintf(
                              "redundant child domain in RU: %s is covered by %s",
                              value,
                              parent,
                          ))
                      }
                  }
              }

              for name, ok := range expectedTLD {
                  if !ok {
                      panic(fmt.Sprintf("RU missing compact TLD: %s", name))
                  }
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("VALIDATION OK")
              fmt.Println("========================================")
              fmt.Println("Categories: 1 (RU only)")
              fmt.Printf("RU rules:  %d\n", len(ru.Domain))
              fmt.Println("Attributes (@ads/@cn): 0 (strictly verified)")
          }
          EOF

          go run ./tools/ru-geosite-filter/validate.go "$GITHUB_WORKSPACE/$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 10. Verify release artifacts
      # ------------------------------------------------------------
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/$OUTPUT_FILE"
          test -s "$GITHUB_WORKSPACE/$OUTPUT_SHA_FILE"
          test -s "$GITHUB_WORKSPACE/$CATEGORY_FILE"

      # ------------------------------------------------------------
      # 11. Publish GitHub Release
      # ------------------------------------------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized RU GeoSite SERVER (no private)"
          make_latest: true

          files: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_categories.txt

          body: |
            # Optimized RU GeoSite SERVER (no private)

            Automatically generated Russian-region GeoSite database for server routing. The output contains RU only; private/blocked/geoblock feeds are excluded.

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 11. Also publish files to release branch and purge jsDelivr cache
      # ------------------------------------------------------------
      - name: Publish files to release branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/geosite-release
          mkdir -p /tmp/geosite-release

          cp "$OUTPUT_FILE" /tmp/geosite-release/geosite_RU.dat
          cp "$OUTPUT_SHA_FILE" /tmp/geosite-release/geosite_RU.dat.sha256sum
          cp "$CATEGORY_FILE" /tmp/geosite-release/geosite_RU_categories.txt

          cd /tmp/geosite-release

          git init
          git checkout -b release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update optimized RU GeoSite"

          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push --force origin release

          echo "Purging jsDelivr CDN cache..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat" > /dev/null || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat.sha256sum" > /dev/null || true
          echo "jsDelivr CDN cache purged."

      # ------------------------------------------------------------
      # 13. Workflow summary
      # ------------------------------------------------------------
      - name: Print download URLs
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest-optimized/geosite_RU.dat"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU.dat"
          echo
          echo "jsDelivr CDN:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"
