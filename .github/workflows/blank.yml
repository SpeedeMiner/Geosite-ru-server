name: Build GeoSite RU Server (RU only)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]

concurrency:
  group: geosite-ru-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rolling:
    uses: ./.github/workflows/release-channel.yml
    with:
      channel: rolling
    permissions:
      contents: write

  numbered:
    uses: ./.github/workflows/release-channel.yml
    with:
      channel: numbered
    permissions:
      contents: write
